<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - ThesisMatrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase Library & Connection Bridge -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        body { background-color: #030712; color: #f8fafc; }
        .cyber-card { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(49, 27, 95, 0.85)); 
            border: 1px solid rgba(129, 140, 248, 0.25); 
            box-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.6), 0 0 35px rgba(129, 140, 248, 0.2); 
        }
        .glow-orb-1 {
            position: absolute; top: 5%; left: 15%; width: 300px; height: 300px;
            background: rgba(99, 102, 241, 0.25); filter: blur(80px); border-radius: 50%; pointer-events: none;
        }
        .glow-orb-2 {
            position: absolute; bottom: 5%; right: 15%; width: 300px; height: 300px;
            background: rgba(168, 85, 247, 0.22); filter: blur(80px); border-radius: 50%; pointer-events: none;
        }
        .cyber-btn { background: linear-gradient(135deg, #7c3aed, #4f46e5); transition: all 0.3s ease; }
        .cyber-btn:hover { background: linear-gradient(135deg, #6d28d9, #4338ca); box-shadow: 0 0 25px rgba(124, 58, 237, 0.6); }
        .cyber-input { background-color: #020617; border: 1px solid #1e293b; color: #ffffff; }
        .cyber-input:focus { border-color: #818cf8; box-shadow: 0 0 12px rgba(129, 140, 248, 0.35); outline: none; }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center px-4 relative overflow-hidden py-10">

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <div class="cyber-card p-8 md:p-10 rounded-3xl w-full max-w-md relative z-10">
        <div class="text-center mb-6">
            <span class="text-xs font-bold uppercase tracking-widest text-purple-300 bg-purple-500/15 px-3.5 py-1.5 rounded-full border border-purple-500/30">Welcome Back</span>
            <h1 class="text-3xl font-black text-white mt-3 tracking-tight">ThesisMatrix</h1>
            <p class="text-slate-400 text-xs mt-1">Log in to access your locked FYP ideas and dashboard.</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-slate-300 text-xs font-semibold mb-2">University Email</label>
                <input type="email" id="loginEmail" placeholder="tania@university.edu.pk" class="cyber-input w-full px-4 py-3 rounded-xl text-sm transition" required>
            </div>

            <div class="mb-6">
                <label class="block text-slate-300 text-xs font-semibold mb-2">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="cyber-input w-full px-4 py-3 rounded-xl text-sm transition" required>
            </div>

            <button type="submit" class="cyber-btn w-full text-white py-3.5 rounded-xl font-bold text-sm tracking-wide shadow-lg">
                Log In &rarr;
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Don't have an account? <a href="signup.html" class="text-purple-400 font-bold hover:underline">Sign up</a>
        </p>
        <div class="text-center mt-4">
            <a href="index.html" class="text-slate-500 text-xs hover:text-slate-300 transition">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            try {
                // Supabase ke zariye user ko authenticate karna
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });

                if (error) {
                    alert('Login Failed: ' + error.message);
                    return;
                }

                alert('Login successful! Redirecting to your dashboard...');
                // User ka name localStorage mein session ke tor par set karna agar data mein ho
                if (data.user && data.user.user_metadata && data.user.user_metadata.full_name) {
                    localStorage.setItem('userName', data.user.user_metadata.full_name);
                }
                
                window.location.href = 'fields.html';

            } catch (err) {
                console.error(err);
                alert('An unexpected error occurred during login.');
            }
        }
    </script>
</body>
</html>
